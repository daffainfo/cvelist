name: Sync NVD CVE feeds

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode"
        required: true
        default: "modified"
        type: choice
        options:
          - modified
          - full

permissions:
  contents: write

concurrency:
  group: nvd-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide sync mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=modified" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync NVD CVE feeds
        run: |
          echo "Running sync mode: ${{ steps.mode.outputs.mode }}"
          python -u scripts/sync_nvd.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cves .sync-meta || true

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "sync: update NVD CVE data"
          git push